spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

app:
  jwt:
    secret: test-only-secret-key-not-for-any-real-use-32bytes-minimum
    expiration-minutes: 60
  otp:
    expose-code-in-response: true
    expiry-minutes: 5
    max-attempts: 5
  checkin:
    base-url: http://localhost:8080/checkin
