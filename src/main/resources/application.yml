spring:
  application:
    name: property-security-platform

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:property_security_platform}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:property_security_app}
    # Local XAMPP dev default only — this database only exists on the dev machine.
    # Override via DB_PASSWORD env var for any non-local environment.
    password: ${DB_PASSWORD:Nq1FfoZsz03eR3rIUe66f78k}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-before-any-real-deployment-32bytes-min}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  otp:
    # Phase 1 stub: no real SMS provider wired up yet. OTP is logged server-side.
    # When true, the raw code is also echoed back in the API response for local/dev testing.
    expose-code-in-response: ${OTP_EXPOSE_CODE:true}
    expiry-minutes: 5
    max-attempts: 5

logging:
  level:
    com.propertysecurity.platform: DEBUG
